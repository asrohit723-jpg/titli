name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test

  # macOS minutes are expensive on private repos, so the app is built only for tags (v0.1.0) or on demand
  mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    permissions:
      contents: write   # to attach the .dmg to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build the presence helper
        run: npm run build:helper
      - name: Smoke test
        run: TITLI_SMOKE_OUT="$PWD/dist/smoke" npx electron scripts/smoke.js
        timeout-minutes: 3
      - name: Build the app
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Titli-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/smoke/*.png
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
