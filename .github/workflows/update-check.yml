name: Update check

# Proves one-click updates work on real Macs:
#   repro:    unpacks the published update by hand into the places the updater has used, on macOS 14 and 15
#   e2e:      installs an older Titli (built from this code) in /Applications, marked as downloaded,
#             lets it update itself from the live release, and checks the new version is in place and running
#   keychain: an ad-hoc Titli, then two versions signed with one (throwaway) certificate, one after the other:
#             saved data gets encrypted, stays readable after the "update", and no password prompt appears
#   untrusted: that signature checks out on a Mac that has never seen the certificate (what the updater checks)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Unpack the published update in different places
        run: |
          note() { msg="$(printf '%s' "$2" | tail -n 20 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; echo "::$1::$msg"; }
          R=https://github.com/asrohit723-jpg/titli-releases/releases
          V="$(curl -sSL "$R/latest/download/latest-mac.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          curl -sSL -o u.zip "$R/download/v$V/Titli-$V-arm64-mac.zip"
          report=""
          for base in "$TMPDIR" "$(python3 -c 'import os; print(os.path.realpath(os.environ["TMPDIR"]))')" "$HOME/Library/Application Support/titli-test"; do
            mkdir -p "$base"; d="$(mktemp -d "$base/titli-update-XXXXXX")"
            out="$(/usr/bin/ditto -x -k u.zip "$d/new" 2>&1)"; rc=$?
            report="$report$rc  $base  ${out:0:160}%0A"
          done
          note notice "$(sw_vers -productVersion): ditto exit code by folder%0A$report"

  e2e:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build an older Titli (0.1.0) from this code
        run: |
          npm run build:helper
          npx electron-builder --mac --arm64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install it in Applications, marked as downloaded
        run: |
          ditto dist/mac-arm64/Titli.app /Applications/Titli.app
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" /Applications/Titli.app
          codesign --verify --deep /Applications/Titli.app
      - name: Let it update itself
        run: |
          note() { msg="$(printf '%s' "$2" | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; echo "::$1::$msg"; }
          LATEST="$(curl -sSL https://github.com/asrohit723-jpg/titli-releases/releases/latest/download/latest-mac.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          TITLI_TEST_UPDATE=1 /Applications/Titli.app/Contents/MacOS/Titli > app.log 2>&1 &
          v=""
          for i in $(seq 1 90); do
            v="$(plutil -extract CFBundleShortVersionString raw -o - /Applications/Titli.app/Contents/Info.plist 2>/dev/null)"
            [ "$v" = "$LATEST" ] && break
            grep -q 'update failed' "$HOME/Library/Logs/Titli/updates.log" 2>/dev/null && break
            sleep 2
          done
          sleep 10
          running="$(pgrep -fl 'Titli.app/Contents/MacOS/Titli$' || true)"
          detail="$(sw_vers -productVersion; grep '\[titli\]' app.log | tail -15; echo '--- updates.log'; cat "$HOME/Library/Logs/Titli/updates.log" 2>/dev/null)"
          if [ "$v" = "$LATEST" ] && [ -n "$running" ]; then
            note notice "Updated itself 0.1.0 -> $v and reopened ($running)%0A$detail"
          else
            note error "Did not update (now $v, wanted $LATEST, running: ${running:-nothing})%0A$detail"
            exit 1
          fi

  keychain:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build:helper
      - name: Build an ad-hoc Titli and two signed ones
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          note() { msg="$(printf '%s' "$2" | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; echo "::$1::$msg"; }
          step() { echo "+ $*" >> steps.log; "$@" >> steps.log 2>&1 || { note error "$(sw_vers -productVersion) failed: $*%0A$(tail -n 30 steps.log)"; exit 1; }; }
          build() {
            step npm pkg set version="$1"
            step npx electron-builder --mac --arm64 --dir --publish never
            app="$(ls -d dist/mac*/Titli.app | head -1)"; test -n "$app" || { note error "no app built: $(ls dist)"; exit 1; }
            mkdir -p "$RUNNER_TEMP/$2"; step ditto "$app" "$RUNNER_TEMP/$2/Titli.app"; rm -rf dist/mac*
          }
          build 0.1.1 adhoc
          step openssl version
          step scripts/make-signing-cert.sh t.p12 throwaway 30
          step scripts/ci-import-cert.sh t.p12 throwaway
          export TITLI_SIGN_IDENTITY="$(grep TITLI_SIGN_IDENTITY "$GITHUB_ENV" | tail -1 | cut -d= -f2)"
          export TITLI_SIGN_KEYCHAIN="$(grep TITLI_SIGN_KEYCHAIN "$GITHUB_ENV" | tail -1 | cut -d= -f2)"
          build 0.1.2 signedA
          build 0.1.3 signedB
          ra="$(codesign -d -r- "$RUNNER_TEMP/signedA/Titli.app" 2>&1 | grep designated)"; rb="$(codesign -d -r- "$RUNNER_TEMP/signedB/Titli.app" 2>&1 | grep designated)"
          note notice "signed builds' requirement (must match):%0A$ra%0A$rb"
          test "$ra" = "$rb"
          ditto -c -k --keepParent "$RUNNER_TEMP/signedB/Titli.app" signedB.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'signed-${{ matrix.os }}', path: signedB.zip }
      - name: Ad-hoc, then signed, then a signed update
        run: |
          note() { msg="$(printf '%s' "$2" | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; echo "::$1::$msg"; }
          install() { rm -rf /Applications/Titli.app; ditto "$RUNNER_TEMP/$1/Titli.app" /Applications/Titli.app; }
          runfor() { ( "/Applications/Titli.app/Contents/MacOS/Titli" > "run-$1.log" 2>&1 & echo $! > pid ); sleep "$2"; kill "$(cat pid)" 2>/dev/null || true; sleep 1; }
          item() { security find-generic-password -s "Titli Safe Storage" >/dev/null 2>&1 && echo yes || echo no; }
          report=""
          install adhoc; runfor adhoc 30
          report="${report}after the ad-hoc version ran: keychain item=$(item)%0A"
          install signedA
          a="$(TITLI_TEST_DATA=write timeout 90 /Applications/Titli.app/Contents/MacOS/Titli 2>&1 | grep '\[titli\] data' || echo 'TIMED OUT (prompt?)')"
          report="${report}signed 0.1.2 writes: $a%0A"
          install signedB
          b="$(TITLI_TEST_DATA=read timeout 90 /Applications/Titli.app/Contents/MacOS/Titli 2>&1 | grep '\[titli\] data' || echo 'TIMED OUT (prompt?)')"
          report="${report}signed 0.1.3 reads: $b%0A"
          head -c 400 "$HOME/Library/Application Support/Titli/titli.json"; echo
          if echo "$a" | grep -q 'encrypted=true onDiskEncrypted=true marker=true' && echo "$b" | grep -q 'encrypted=true onDiskEncrypted=true marker=true unlockFailed=false'; then
            note notice "$(sw_vers -productVersion): saved data stays encrypted and readable across a signed update%0A$report"
          else
            note error "$(sw_vers -productVersion): Keychain check failed%0A$report"; exit 1
          fi

  untrusted:
    needs: keychain
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-15] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: 'signed-${{ matrix.os }}' }
      - name: The updater's signature check on a Mac that doesn't know the certificate
        run: |
          ditto -x -k signedB.zip out
          codesign --verify --deep --verbose=2 out/Titli.app
          codesign -dv --verbose=2 out/Titli.app 2>&1 | grep -E 'Authority|Signature|TeamIdentifier'
          echo "::notice::$(sw_vers -productVersion): codesign --verify --deep passes without trusting the certificate"

